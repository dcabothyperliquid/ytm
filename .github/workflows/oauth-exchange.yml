name: oauth-exchange (temporary)
on:
  workflow_dispatch:
    inputs:
      code:
        required: true
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange
        env:
          CODE: ${{ inputs.code }}
          CID: ${{ secrets.YT_CLIENT_ID }}
          CSEC: ${{ secrets.YT_CLIENT_SECRET }}
          GH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -q pynacl requests
          python - <<'PY'
          import os, json, base64, requests
          from nacl import public, encoding
          r = requests.post("https://oauth2.googleapis.com/token", data={
              "code": os.environ["CODE"], "client_id": os.environ["CID"], "client_secret": os.environ["CSEC"],
              "redirect_uri": "https://developers.google.com/oauthplayground", "grant_type": "authorization_code"})
          d = r.json()
          out = {"status": r.status_code, "error": d.get("error"), "desc": d.get("error_description"),
                 "scope": d.get("scope"), "refresh_token": d.get("refresh_token")}
          if d.get("access_token"):
              ch = requests.get("https://www.googleapis.com/youtube/v3/channels", params={"part": "snippet", "mine": "true"},
                                headers={"Authorization": "Bearer " + d["access_token"]}).json()
              out["channels"] = [(i["id"], i["snippet"]["title"]) for i in ch.get("items", [])]
              out["ch_err"] = ch.get("error", {}).get("message")
          box = public.SealedBox(public.PublicKey("Xop0QE7xh4xBp2ARZdMWYFs1TIXXcylkOwcGFZ0b0mk=".encode(), encoding.Base64Encoder))
          blob = base64.b64encode(box.encrypt(json.dumps(out).encode())).decode()
          h = {"Authorization": "Bearer " + os.environ["GH"], "Accept": "application/vnd.github+json"}
          u = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/contents/oauth_tmp.enc"
          p = requests.put(u, headers=h, json={"message": "tmp", "branch": "ytm-data",
                           "content": base64.b64encode(blob.encode()).decode()})
          print("stored", p.status_code)
          PY
