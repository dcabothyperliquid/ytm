name: YT End Live (manual)

# One-off: marks our ACTIVE YouTube broadcast as complete (use when the channel still shows LIVE).
on:
  workflow_dispatch: {}

jobs:
  end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: End active broadcast
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python ytm_runner.py endlive
