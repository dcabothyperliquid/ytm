name: YT Live Mirror

# Everything runs here: watch channels, detect live, relay with ffmpeg -c copy.
# Config/state = JSON files on the `ytm-data` branch (no Render, no Turso).
# cron chains runs: the next one queues behind the current (concurrency group) and
# starts when it ends. A cheap "gate" step skips the heavy steps when the mirror is
# OFF / outside the time window / daily cap reached.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: yt-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate (cheap)
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ytm_runner.py gate

      - name: Install ffmpeg + yt-dlp
        if: steps.gate.outputs.go == 'true'
        timeout-minutes: 12          # a hung apt/pip once blocked this step for 1h and the mirror was down: fail fast, cron retries
        run: |
          for i in 1 2 3; do
            timeout 240 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg && break
            echo "apt retry $i"; sleep 5
          done
          command -v ffmpeg
          for i in 1 2 3; do
            timeout 180 pip install -U "yt-dlp[default]" && break
            echo "pip retry $i"; sleep 5
          done
          command -v yt-dlp
          node --version

      - name: Cookies (optional)
        if: steps.gate.outputs.go == 'true'
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies_raw
            python - <<'PY'
          import json
          raw = open("cookies_raw").read().strip()
          if raw[:1] in "[{":
              d = json.loads(raw)
              d = d.get("cookies", d) if isinstance(d, dict) else d
              out = ["# Netscape HTTP Cookie File"]
              for c in d:
                  dom = c.get("domain", "")
                  exp = int(c.get("expirationDate") or c.get("expires") or 0)
                  out.append("\t".join([dom, "TRUE" if dom.startswith(".") else "FALSE", c.get("path", "/"),
                                        "TRUE" if c.get("secure") else "FALSE", str(max(exp, 0)), c["name"], c["value"]]))
              raw = "\n".join(out)
          open("cookies.txt", "w").write(raw + "\n")
          PY
            rm -f cookies_raw
          fi

      - name: Watch + relay
        if: steps.gate.outputs.go == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
          FB_STREAM_KEY: ${{ secrets.FB_STREAM_KEY }}      # optional: Facebook Page (LML Sports) gets the same stream. Unset = YouTube only.
          FB_ENABLE: ${{ vars.FB_ENABLE || 'on' }}          # set repo variable FB_ENABLE=off to pause Facebook without touching the secret
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python ytm_runner.py run
